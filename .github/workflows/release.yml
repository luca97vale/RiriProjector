name: Release

# Builds the signed release APK for a vX.Y.Z tag and attaches it to a GitHub release (ADR-012).
# Secrets, stored ONLY in the `release` environment (with a required reviewer):
# RELEASE_KEYSTORE_BASE64, RIRI_KEYSTORE_PASSWORD, RIRI_KEY_ALIAS, RIRI_KEY_PASSWORD.
# A tag push runs the release.yml of the tagged commit, so the environment's required reviewer is
# the security boundary; the on-main check below only guards against mistakes. See README › Releasing.
# Secrets are scoped to the steps that need them.

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: Secrets present
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RIRI_KEYSTORE_PASSWORD: ${{ secrets.RIRI_KEYSTORE_PASSWORD }}
          RIRI_KEY_ALIAS: ${{ secrets.RIRI_KEY_ALIAS }}
          RIRI_KEY_PASSWORD: ${{ secrets.RIRI_KEY_PASSWORD }}
        run: |
          missing=0
          for v in KS_B64 RIRI_KEYSTORE_PASSWORD RIRI_KEY_ALIAS RIRI_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              name="$v"; [ "$v" = KS_B64 ] && name=RELEASE_KEYSTORE_BASE64
              echo "::error::secret $name is missing"; missing=1
            fi
          done
          exit "$missing"

      - name: Version from tag
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          major=$((10#${BASH_REMATCH[1]})); minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::minor and patch must be <= 99 (versionCode = major*10000 + minor*100 + patch)"; exit 1
          fi
          code=$((major * 10000 + minor * 100 + patch))
          if [ "$code" -lt 1 ]; then echo "::error::versionCode must be >= 1"; exit 1; fi
          echo "name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The build must not be able to read a token that can rewrite releases; gh uses GH_TOKEN.
          persist-credentials: false

      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point to a commit on main"; exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # No cache: a signing build must not read caches written by PR builds.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RIRI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # --no-configuration-cache: never serialize the signing passwords into a cache entry.
      # --no-daemon: no Gradle process holding the passwords outlives this step.
      - name: Unit test and build signed APK
        env:
          RIRI_KEYSTORE_PASSWORD: ${{ secrets.RIRI_KEYSTORE_PASSWORD }}
          RIRI_KEY_ALIAS: ${{ secrets.RIRI_KEY_ALIAS }}
          RIRI_KEY_PASSWORD: ${{ secrets.RIRI_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: >-
          ./gradlew --no-configuration-cache --no-daemon testDebugUnitTest assembleRelease
          -Priri.versionName="$VERSION_NAME" -Priri.versionCode="$VERSION_CODE"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signature
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk not found (unsigned build?)"; ls -l app/build/outputs/apk/release/ || true; exit 1
          fi
          stable=$(ls "$ANDROID_HOME/build-tools" | { grep -v -- '-rc' || true; } | sort -V | tail -1)
          if [ -z "$stable" ]; then echo "::error::no stable build-tools in $ANDROID_HOME/build-tools"; exit 1; fi
          bt="$ANDROID_HOME/build-tools/$stable"
          "$bt/apksigner" verify --min-sdk-version 28 --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/ririprojector-$VERSION_NAME.apk"
          # Stable name: …/releases/latest/download/ririprojector.apk always points at the newest APK.
          cp "$apk" dist/ririprojector.apk
          cp app/build/outputs/mapping/release/mapping.txt "dist/ririprojector-$VERSION_NAME-mapping.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
          fi
