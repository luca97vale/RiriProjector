name: Funzionalità / miglioramento
description: Nuova funzionalità o miglioramento (anche di prestazioni)
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Contesto / problema
      description: Perché serve? Quale limite attuale risolve?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento atteso
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criteri di accettazione
      description: Verificabili; per le prestazioni indica numeri (latenza, fps, bitrate, durata del test).
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Fuori scope
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [sender, receiver, protocol, media, audio, net, ui, ci/tooling]
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Dispositivi coinvolti
      placeholder: "Galaxy Tab S9 (One UI 6.1) → Fire TV Stick 4K Max (Fire OS 8)"
