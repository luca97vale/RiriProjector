name: Feature / improvement
description: New feature or improvement (including performance)
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context / problem
      description: Why is it needed? Which current limitation does it address?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable; for performance give numbers (latency, fps, bitrate, A/V offset, test duration).
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [sender, receiver, protocol, media, audio, net, ui, ci/tooling]
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Devices involved
      placeholder: "Sender: phone/tablet model (Android 14) → Receiver: TV/projector/phone model (Android 11)"
