name: Bug
description: Wrong behavior, crash, video artifacts, audio problems, disconnections
title: "fix: "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Description, with screenshots/video if useful (e.g. artifacts, freezes, stutter, audio gaps).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: sender
    attributes:
      label: Sender (tablet model / Android version / One UI)
    validations:
      required: true
  - type: input
    id: receiver
    attributes:
      label: Receiver (Fire TV or projector model / Fire OS)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: ["Wi-Fi 5 GHz", "Wi-Fi 2.4 GHz", "Ethernet (receiver)", "Hotspot", "Other"]
  - type: input
    id: settings
    attributes:
      label: Streaming settings
      placeholder: "HEVC 1920x1080@60, 12 Mbps, PCM audio"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "adb logcat -d -s 'Riri/*:*' '*:E' from both devices"
      render: text
