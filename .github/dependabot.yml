version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
    labels: ["type:chore", "area:ci"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["type:chore", "area:ci"]
